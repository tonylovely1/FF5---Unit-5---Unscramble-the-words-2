tw-space-y-reverse)));margin-bottom:calc(0px * var(--tw-space-y-reverse))}.sm\:text-left{text-align:left}.sm\:text-2xl{font-size:1.5rem;line-height:2rem}.sm\:text-base{font-size:1rem;line-height:1.5rem}.sm\:text-sm{font-size:0.875rem;line-height:1.25rem}.sm\:text-xl{font-size:1.25rem;line-height:1.75rem}}</style></head>
<body>
    <div class="game-wrapper">
        <div class="game-card">
            
            <!-- Header & Language Toggle & Timer & Progress -->
            <header class="flex flex-col sm:flex-row sm:justify-between items-center mb-6 pt-2">
                <h1 id="header-title" class="text-xl sm:text-2xl font-extrabold text-[#06b6d4] mb-3 sm:mb-0 text-center sm:text-left">Ôn tập Từ vựng Thời tiết</h1>
                
                <div class="flex items-center space-x-4 mt-3 sm:mt-0">
                    <!-- Language Toggle -->
                    <button id="lang-toggle" class="px-3 py-1 bg-gray-200 text-sm font-bold text-gray-700 rounded-lg hover:bg-gray-300 transition shadow-md">EN</button>
                    <!-- Timer Display -->
                    <div class="text-lg sm:text-xl font-bold text-gray-700 p-3 bg-yellow-200 rounded-xl shadow-md">
                        <span id="timer-icon" role="img" aria-label="Đồng hồ">⏱️</span>
                        <span id="timer-display">00:31</span>
                    </div>
                </div>
            </header>

            <!-- Instructions -->
            <p id="instructions" class="text-sm sm:text-base font-medium mb-4 p-3 border-l-4 border-cyan-500 bg-cyan-50 rounded-lg text-gray-700">Kéo và thả các chữ cái từ Kho Chữ cái vào các ô trống để sắp xếp thành từ vựng tiếng Anh đúng.</p>

            <!-- PROGRESS BAR -->
            <div class="mb-6">
                <div class="flex justify-between mb-1 text-xs sm:text-sm font-medium text-gray-700">
                    <span id="progress-text-label">Tiến độ Từ vựng</span>
                    <span id="progress-text">1 / 4</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="progress-bar" class="bg-cyan-500 h-3 rounded-full transition-all duration-300" style="width: 25%;"></div>
                </div>
            </div>

            <!-- CURRENT WORD DISPLAY AREA -->
            <div id="current-word-area" class="flex flex-col items-center justify-center p-6 bg-cyan-50 rounded-xl border border-cyan-200 mb-6 min-h-[14rem]"> 
                
                <!-- Icon Hint -->
                <div id="word-icon" class="text-6xl mb-4">🥵</div>
                
                <!-- Drop Zones (Letter slots) -->
                <div id="drop-zone-container" class="drop-zone-container" onclick="handleDropZoneClick(event)"><div class="drop-zone" data-slot-index="0"></div><div class="drop-zone" data-slot-index="1"></div><div class="drop-zone" data-slot-index="2"></div><div class="drop-zone" data-slot-index="3"></div><div class="drop-zone" data-slot-index="4"></div></div>
            </div>

            <!-- Letter Bank (Pill Holder) -->
            <h2 id="bank-title" class="text-lg sm:text-xl font-bold text-gray-700 mb-3 p-3 bg-cyan-100 rounded-lg border-l-4 border-cyan-500">Kho Chữ cái: Kéo/Nhấn để Sắp xếp</h2>
            <div id="letter-bank" class="flex flex-wrap justify-center p-4 bg-cyan-50 rounded-xl shadow-inner min-h-[6rem] mb-6" ondragover="handleDragOver(event)" ondrop="handleDrop(event)"><div data-text="U" data-id="letter-1-1764834938700" class="letter-pill" draggable="true">U</div><div data-text="H" data-id="letter-0-1764834938700" class="letter-pill" draggable="true">H</div><div data-text="D" data-id="letter-4-1764834938700" class="letter-pill" draggable="true">D</div><div data-text="I" data-id="letter-3-1764834938700" class="letter-pill" draggable="true">I</div><div data-text="M" data-id="letter-2-1764834938700" class="letter-pill" draggable="true">M</div></div>

            <!-- Action Area (Buttons) -->
            <div class="flex flex-col sm:flex-row justify-center space-y-3 sm:space-y-0 sm:space-x-6 mt-6">
                <button id="try-again-button" class="px-8 py-4 bg-gray-500 text-white font-bold text-lg rounded-xl shadow-xl hover:bg-gray-600 transition transform hover:scale-[1.02]">Thử lại / Xáo trộn</button>
                <button id="check-button" class="flex items-center justify-center px-8 py-4 bg-cyan-600 text-white font-bold text-lg rounded-xl shadow-xl hover:bg-cyan-700 transition transform hover:scale-[1.02]">Kiểm tra Từ</button>
            </div>
            
            <!-- Feedback Message -->
            <div id="feedback-message" class="text-center mt-4 text-xl font-bold min-h-[2.5rem]"></div>
        </div>
    </div>

    <!-- Winning Modal -->
    <div id="winning-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-80 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-sm w-full text-center border-t-8 border-yellow-500 animate-pop-in">
            <div class="text-7xl mb-5 animate-pulse">🌟🥳🥇</div>
            <h2 id="modal-title" class="text-4xl font-extrabold text-cyan-700 mb-3">Hoàn thành Trò chơi!</h2>
            <p id="modal-text" class="text-xl text-gray-600 mb-6">
                <!-- Modal text updated by JS -->
            </p>
            <button id="modal-close-button" class="px-8 py-4 bg-cyan-600 text-white font-semibold rounded-xl hover:bg-cyan-700 transition transform hover:scale-105 shadow-lg" onclick="window.location.reload()">Chơi lại</button>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH DỮ LIỆU CỤ THỂ ---
        
        const TOTAL_WORDS = 4;
        
        // Danh sách từ vựng
        const vocabularyList = [
            { id: 1, word: "HUMID", icon: "🥵" },   
            { id: 2, word: "STORMY", icon: "⛈️" },  
            { id: 3, word: "CLOUDY", icon: "☁️" },  
            { id: 4, word: "FOGGY", icon: "🌫️" }    
        ];

        // --- DỮ LIỆU SONG NGỮ ---
        const languageData = {
            vi: {
                title: "Ôn tập Từ vựng Thời tiết",
                instructions: "Kéo và thả các chữ cái từ Kho Chữ cái vào các ô trống để sắp xếp thành từ vựng tiếng Anh đúng.",
                progressLabel: "Tiến độ Từ vựng",
                bankTitle: "Kho Chữ cái: Kéo/Nhấn để Sắp xếp",
                tryAgainButton: "Thử lại / Xáo trộn",
                checkButton: "Kiểm tra Từ",
                feedbackFillSlots: "Vui lòng điền tất cả các chữ cái vào ô trống.",
                feedbackCorrect: (word) => `✅ Chính xác! Từ đúng là: "${word}". Đang phát âm và chuyển sang từ tiếp theo.`,
                feedbackIncorrect: "❌ Sai rồi. Vui lòng kiểm tra lại thứ tự chữ cái.",
                modalTitle: "Hoàn thành Trò chơi!",
                modalText: (time) => `Bạn đã sắp xếp đúng tất cả ${TOTAL_WORDS} từ trong thời gian: <strong>${time}</strong>`,
                modalClose: "Chơi lại",
            },
            en: {
                title: "Weather Vocabulary Review",
                instructions: "Drag and drop the letters from the Letter Bank into the slots to form the correct English vocabulary word.",
                progressLabel: "Vocabulary Progress",
                bankTitle: "Letter Bank: Drag/Click to Scramble",
                tryAgainButton: "Try Again / Shuffle",
                checkButton: "Check Word",
                feedbackFillSlots: "Please fill all letter slots.",
                feedbackCorrect: (word) => `✅ Correct! The word is: "${word}". Pronouncing and moving to the next word.`,
                feedbackIncorrect: "❌ Incorrect. Please check the order of the letters.",
                modalTitle: "Game Complete!",
                modalText: (time) => `You correctly unscrambled all ${TOTAL_WORDS} words in: <strong>${time}</strong>`,
                modalClose: "Play Again",
            }
        };


        // --- TRẠNG THÁI TOÀN CỤC ---
        const $ = selector => document.querySelector(selector);
        const $$ = selector => document.querySelectorAll(selector);
        
        let currentWordIndex = 0;
        let timerInterval = null;
        let startTime = 0; 
        
        let draggedPill = null; 
        let isSpeaking = false; 
        let currentLang = 'vi'; // Mặc định là tiếng Việt
        
        
        // --- CHỨC NĂNG CẬP NHẬT NGÔN NGỮ (BILINGUAL FUNCTIONALITY) ---
        function updateUIForLanguage(lang) {
            currentLang = lang;
            const data = languageData[lang];
            const otherLang = lang === 'vi' ? 'en' : 'vi';

            // Cập nhật các phần tử giao diện
            $('#header-title').textContent = data.title;
            $('#instructions').textContent = data.instructions;
            $('#progress-text-label').textContent = data.progressLabel;
            $('#bank-title').textContent = data.bankTitle;
            $('#try-again-button').textContent = data.tryAgainButton;
            $('#check-button').textContent = data.checkButton;
            $('#modal-title').textContent = data.modalTitle;
            $('#modal-close-button').textContent = data.modalClose;
            
            // Cập nhật nút chuyển đổi
            const toggleButton = $('#lang-toggle');
            toggleButton.textContent = otherLang.toUpperCase();
            
            // Xóa feedback cũ khi chuyển ngôn ngữ
            clearFeedback(); 
        }

        function toggleLanguage() {
            const newLang = currentLang === 'vi' ? 'en' : 'vi';
            updateUIForLanguage(newLang);
        }

        // --- CHỨC NĂNG TTS (PHÁT ÂM) ---
        
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; 
                utterance.rate = 0.9; 
                
                isSpeaking = true;
                $('#check-button').disabled = true;

                utterance.onend = () => {
                    isSpeaking = false;
                    $('#check-button').disabled = false;
                    
                    // Tự động chuyển sang từ tiếp theo sau khi phát âm xong
                    currentWordIndex++;
                    loadCurrentWord();
                };

                utterance.onerror = (event) => {
                    console.error('Speech synthesis error:', event);
                    isSpeaking = false;
                    $('#check-button').disabled = false;
                    
                    // Chuyển sang từ tiếp theo nếu có lỗi phát âm
                    currentWordIndex++;
                    loadCurrentWord();
                };
                
                window.speechSynthesis.speak(utterance);
            } else {
                console.warn('Web Speech API không được hỗ trợ. Chuyển sang từ tiếp theo.');
                currentWordIndex++;
                loadCurrentWord();
            }
        }

        // --- CHỨC NĂNG HỖ TRỢ ---

        function shuffleArray(array) {
            const newArray = [...array]; 
            let currentIndex = newArray.length, randomIndex;
            
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;

                let temp = newArray[currentIndex];
                newArray[currentIndex] = newArray[randomIndex];
                newArray[randomIndex] = temp;
            }

            return newArray;
        }
        
        function getCurrentGuessedWord() {
            const dropZones = $$('#drop-zone-container .drop-zone');
            let guessedLetters = [];
            
            dropZones.forEach(zone => {
                const pill = zone.querySelector('.letter-pill');
                if (pill) {
                    guessedLetters.push(pill.dataset.text);
                } else {
                     guessedLetters.push('');
                }
            });
            
            // Sửa lỗi: Đảm bảo chuỗi trả về KHÔNG có khoảng trắng ở đầu/cuối nếu nó có các ký tự,
            // nhưng giữ nguyên nếu nó có các ký tự trống ('' là placeholder cho ô trống)
            return guessedLetters.join('');
        }
        
        // --- CẬP NHẬT UI & TIMER ---

        function updateTimerDisplay() {
            const elapsed = Date.now() - startTime;
            const totalSeconds = Math.floor(elapsed / 1000);
            const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            $('#timer-display').textContent = `${minutes}:${seconds}`;
        }

        function startTimer() {
            if (startTime === 0) startTime = Date.now();
            if (!timerInterval) {
                timerInterval = setInterval(updateTimerDisplay, 1000);
            }
        }
        
        function stopTimer() {
             if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function updateProgress() {
            const total = vocabularyList.length;
            const current = currentWordIndex;
            
            const displayIndex = Math.min(current + 1, total);
            $('#progress-text').textContent = `${displayIndex} / ${total}`;
            
            const percent = ((current + 1) / total) * 100;
            $('#progress-bar').style.width = `${percent}%`;
        }
        
        function clearFeedback() {
             if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            
            const feedbackEl = $('#feedback-message');
            feedbackEl.textContent = '';
            feedbackEl.classList.remove('text-green-600', 'text-red-600');
            
            // Đặt lại màu sắc mặc định cho Drop Zone
            $$('.drop-zone').forEach(zone => {
                zone.style.animation = 'none';
                zone.style.borderColor = '#67e8f9'; 
                zone.style.backgroundColor = '#e0f6ff';
                const pill = zone.querySelector('.letter-pill');
                if(pill) pill.style.backgroundColor = '#06b6d4'; 
            });
        }
        
        /**
         * Tạo một viên gạch chữ cái kéo thả.
         */
        function createLetterPill(letter, id) {
            const pill = document.createElement('div');
            
            pill.textContent = letter; 
            pill.dataset.text = letter; // Lưu trữ chữ cái
            pill.dataset.id = id; // ID duy nhất
            pill.className = 'letter-pill';
            pill.draggable = true;
            
            pill.addEventListener('dragstart', handleDragStart);
            pill.addEventListener('dragend', handleDragEnd);
            pill.addEventListener('click', handlePillClick); 
            
            return pill;
        }

        // --- CƠ CHẾ CLICK/TAP & KÉO THẢ ---
        
        function handlePillClick(e) {
            e.stopPropagation();
            if (isSpeaking) return; 
            
            const pill = e.target.closest('.letter-pill');
            if (!pill) return;
            
            clearFeedback();
            
            if (pill.parentNode.id === 'letter-bank') {
                // 1. Nhấn vào chữ cái trong BANK: Tự động thả vào ô trống đầu tiên
                
                const emptyZone = $('.drop-zone:not(:has(.letter-pill))');
                if (emptyZone) {
                    const originalParent = pill.parentNode;
                    originalParent.removeChild(pill);
                    emptyZone.appendChild(pill);
                }

            } 
            else if (pill.parentNode.classList.contains('drop-zone')) {
                // 2. Nhấn vào chữ cái đã THẢ: Chuyển nó trở lại ngân hàng
                
                const originalParent = pill.parentNode;
                const letterBank = $('#letter-bank');
                
                originalParent.removeChild(pill);
                letterBank.appendChild(pill);
            }
        }

        function handleDropZoneClick(e) {
            if (isSpeaking) return; 
            
            const dropZone = e.target.closest('.drop-zone');
            if (!dropZone) return;
        }

        function handleDragStart(e) {
            if (isSpeaking) {
                e.preventDefault();
                return;
            }

            const pill = e.target.closest('.letter-pill');
            if (!pill) return;
            
            draggedPill = pill; 
            e.dataTransfer.setData('text/plain', pill.dataset.id); 
            e.dataTransfer.effectAllowed = 'move';
            pill.classList.add('dragging');
            clearFeedback(); 
        }

        function handleDragEnd(e) {
            if (draggedPill) {
                draggedPill.classList.remove('dragging');
            }
            draggedPill = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            if (isSpeaking) return; 
            
            const target = e.target.closest('.drop-zone, #letter-bank');
            
            $$('.drop-zone').forEach(zone => zone.classList.remove('opacity-70'));
            
            if (target && target.classList.contains('drop-zone') && !target.querySelector('.letter-pill')) { 
                target.classList.add('opacity-70'); 
            }
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            if (isSpeaking) return; 
            
            $$('.drop-zone').forEach(zone => zone.classList.remove('opacity-70'));
            
            const targetDropZone = e.target.closest('.drop-zone');
            const targetBank = e.target.closest('#letter-bank');

            if (!draggedPill) return; 
            const pillToMove = draggedPill;
            const originalParent = pillToMove.parentNode;

            // 1. Thả vào ô trống (Drop Zone)
            if (targetDropZone && !targetDropZone.querySelector('.letter-pill')) {
                // Logic thả thông thường
                if (originalParent !== targetDropZone) {
                    originalParent.removeChild(pillToMove);
                    targetDropZone.appendChild(pillToMove);
                }
            } 
            // 2. Trao đổi vị trí giữa hai ô đã có chữ cái (Chỉ cho phép nếu cả hai đều ở Drop Zone)
            else if (targetDropZone && targetDropZone.querySelector('.letter-pill') && originalParent.classList.contains('drop-zone')) {
                const targetPill = targetDropZone.querySelector('.letter-pill');
                const targetOriginalParent = targetPill.parentNode;
                
                originalParent.removeChild(pillToMove);
                targetOriginalParent.removeChild(targetPill);
                
                targetOriginalParent.appendChild(pillToMove);
                originalParent.appendChild(targetPill);
            }
            // 3. Thả từ từ bất kỳ đâu về Kho Chữ cái (Bank)
            else if (targetBank) {
                if(originalParent !== targetBank) {
                    originalParent.removeChild(pillToMove);
                    targetBank.appendChild(pillToMove);
                }
            } 

            if (draggedPill) draggedPill.classList.remove('dragging');
            draggedPill = null;
            clearFeedback(); 
        }

        
        // --- RENDER & LOGIC TRÒ CHƠI ---
        
        function loadCurrentWord() {
            clearFeedback();
            $('#check-button').disabled = false;

            if (currentWordIndex >= vocabularyList.length) {
                handleGameComplete();
                return; 
            } else {
                const currentItem = vocabularyList[currentWordIndex];
                const correctWord = currentItem.word;
                
                $('#word-icon').textContent = currentItem.icon;
                updateProgress();
                
                const dropZoneContainer = $('#drop-zone-container');
                dropZoneContainer.innerHTML = '';
                
                // Tạo các ô thả (drop zones)
                for (let i = 0; i < correctWord.length; i++) {
                    const zone = document.createElement('div');
                    zone.className = 'drop-zone'; 
                    zone.dataset.slotIndex = i;
                    zone.addEventListener('dragover', handleDragOver);
                    zone.addEventListener('drop', handleDrop);
                    dropZoneContainer.appendChild(zone);
                }
                
                // Tạo và xáo trộn các viên gạch chữ cái trong ngân hàng
                const letterBank = $('#letter-bank');
                letterBank.innerHTML = '';
                
                // Tách từ thành các chữ cái và tạo đối tượng
                let letterObjects = correctWord.split('').map((letter, index) => ({
                    text: letter,
                    id: `letter-${index}-${Date.now()}` // ID duy nhất cho mỗi pill
                }));

                const scrambledLetters = shuffleArray(letterObjects); 

                scrambledLetters.forEach(obj => {
                    const pill = createLetterPill(obj.text, obj.id);
                    letterBank.appendChild(pill);
                });
            }
        }
        
        function handleGameComplete() {
             stopTimer(); 
            const finalTime = $('#timer-display').textContent;
            const data = languageData[currentLang];
            
            // Cập nhật modal text và hiển thị
            document.querySelector('#modal-text').innerHTML = data.modalText(finalTime);

            $('#winning-modal').classList.remove('hidden');
        }

        function checkAnswer() {
            if (currentWordIndex >= vocabularyList.length || isSpeaking) return; 

            const guessedWord = getCurrentGuessedWord();
            const correctWord = vocabularyList[currentWordIndex].word;
            const data = languageData[currentLang];
            
            clearFeedback();
            
            const wordArea = $('#current-word-area');

            // 1. Kiểm tra trực tiếp DOM để đảm bảo TẤT CẢ các ô đều có chữ cái.
            let allSlotsFilled = true;
            const dropZones = $$('#drop-zone-container .drop-zone');

            for (const zone of dropZones) {
                if (!zone.querySelector('.letter-pill')) {
                    allSlotsFilled = false;
                    break;
                }
            }

            if (!allSlotsFilled) {
                const feedbackEl = $('#feedback-message');
                feedbackEl.textContent = data.feedbackFillSlots;
                feedbackEl.classList.add('text-red-600');
                
                wordArea.style.animation = 'shake 0.3s';
                setTimeout(() => wordArea.style.animation = 'none', 300);
                return;
            }
            
            // 2. Kiểm tra từ đúng
            // Chuẩn hóa (trim/toUpperCase) để so sánh nghiêm ngặt
            const cleanedGuessedWord = guessedWord.toUpperCase().trim();
            const cleanedCorrectWord = correctWord.toUpperCase().trim();
            
            if (cleanedGuessedWord === cleanedCorrectWord) {
                
                const feedbackEl = $('#feedback-message');
                feedbackEl.textContent = data.feedbackCorrect(correctWord);
                feedbackEl.classList.add('text-green-600');
                
                // Highlight slots xanh lá
                $$('.drop-zone').forEach(zone => {
                    zone.style.borderColor = '#16a34a'; // Green-600
                    zone.style.backgroundColor = '#dcfce7'; // Green-50
                    const pill = zone.querySelector('.letter-pill');
                    if(pill) pill.style.backgroundColor = '#16a34a'; // Darker green for correct pills
                });
                
                // Phát âm từ. Hàm này sẽ tự động chuyển từ khi kết thúc.
                speakText(correctWord);

            } else {
                // SAI
                const feedbackEl = $('#feedback-message');
                feedbackEl.textContent = data.feedbackIncorrect;
                feedbackEl.classList.add('text-red-600');
                
                wordArea.style.animation = 'shake 0.3s';
                setTimeout(() => wordArea.style.animation = 'none', 300);
            }
        }
        
        /**
         * Chuyển tất cả các chữ cái đã thả về Kho Chữ cái và xáo trộn lại.
         */
        function tryAgain() {
            if (currentWordIndex >= vocabularyList.length || isSpeaking) return; 
            
            const letterBank = $('#letter-bank');
            const pillsToMove = [];
            
            // Di chuyển tất cả các viên gạch từ Drop Zone về Bank
            $$('.drop-zone').forEach(zone => {
                const pill = zone.querySelector('.letter-pill');
                if (pill) {
                    pillsToMove.push(pill);
                }
            });
            
            pillsToMove.forEach(pill => {
                pill.parentNode.removeChild(pill);
                letterBank.appendChild(pill);
            });
            
            // Xáo trộn các chữ cái trong Bank
            const bankChildren = Array.from(letterBank.children);
            const shuffledChildren = shuffleArray(bankChildren);
            
            letterBank.innerHTML = '';
            shuffledChildren.forEach(child => letterBank.appendChild(child));

            clearFeedback();
        }

        function initGame() {
            // Tải ngôn ngữ mặc định (VI)
            updateUIForLanguage('vi');
            
            // Tải từ đầu tiên và khởi động bộ đếm giờ
            loadCurrentWord();
            startTimer(); 

            // Gắn các sự kiện
            $('#check-button').addEventListener('click', checkAnswer);
            $('#try-again-button').addEventListener('click', () => { if (!isSpeaking) tryAgain(); });
            $('#lang-toggle').addEventListener('click', toggleLanguage);
        }

        window.onload = initGame;
    </script>

</body></html>
